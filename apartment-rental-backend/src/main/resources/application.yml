server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 8h
      cookie:
        name: ANCU_SESSION
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:./apartment-rental-backend/.env[.properties]
      - optional:file:./smtp.local.properties
      - optional:file:./apartment-rental-backend/smtp.local.properties
  application:
    name: apartment-rental-backend
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      "[mail.smtp.auth]": ${SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${SMTP_STARTTLS:true}
      "[mail.smtp.starttls.required]": ${SMTP_STARTTLS:true}
      "[mail.smtp.ssl.enable]": ${SMTP_SSL:false}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
  datasource:
    url: ${DB_URL:jdbc:h2:mem:ancu;MODE=MSSQLServer;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/dialect/{vendor},classpath:vn/ancu/rental/db/migration
    baseline-on-migrate: false
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    serialization:
      write-dates-as-timestamps: false

ancu:
  mail:
    from: ${SMTP_FROM:${SMTP_USERNAME:}}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
  security:
    cookie-secure: ${SESSION_COOKIE_SECURE:false}
    csrf-enabled: ${CSRF_ENABLED:true}
