spring:
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/dialect/{vendor},classpath:vn/ancu/rental/db/migration
    baseline-on-migrate: false
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=AnCuRental;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:com.microsoft.sqlserver.jdbc.SQLServerDriver}
