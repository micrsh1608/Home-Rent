spring:
  datasource:
    url: jdbc:h2:mem:ancu_test;MODE=MSSQLServer;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/dialect/{vendor},classpath:vn/ancu/rental/db/migration
    baseline-on-migrate: false

ancu:
  contracts:
    no-show-cron: "-"
